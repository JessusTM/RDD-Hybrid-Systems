services:
  backend:
    build: ./mdd-hqc-backend
    container_name: mdd-hqc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./mdd-hqc-backend/app:/app/app
      - ./mdd-hqc-backend/data:/app/data
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openrouter/free}"
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434/api/generate}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral:latest}"
    networks:
      - appnet

  frontend:
    build: ./mdd-hqc-frontend
    container_name: mdd-hqc-frontend
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./mdd-hqc-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - appnet

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - appnet
    command: ["serve"]
    profiles: ["ollama"]

networks:
  appnet:
    driver: bridge

volumes:
  ollama_data:
